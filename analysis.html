<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroSense - Analysis Dashboard</title>

  <!-- External Stylesheets -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <h1 class="nav-brand">AeroSense</h1>
      </div>
      <div class="nav-right">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="request.html" class="nav-link">Request</a>
        <a href="#" class="nav-link" onclick="scrollToSection('map')">Analysis</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <!-- Map Section -->
    <section id="map" class="map-section">
      <h2 class="section-title">Location Analysis</h2>
      <div id="map" style="height: 400px; border-radius: 12px; box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08); border: 1px solid var(--border);"></div>
    </section>

    <!-- Location Info -->
    <section class="stats-section">
      <div class="stat-card" id="locationInfo">
        <div class="stat-icon fas fa-map-marker-alt"></div>
        <div class="stat-label">Selected Location</div>
        <div class="stat-value" id="selectedLocation">None</div>
        <div class="stat-label" style="margin-top: 0.5rem;">Nearest Sensor</div>
        <div class="stat-value" id="nearestSensor">None</div>
      </div>
    </section>

    <!-- Predicted AQI -->
    <section class="stats-section">
      <div class="stat-card" id="predictedAQI">
        <div class="stat-icon fas fa-chart-line"></div>
        <div class="stat-label">Predicted AQI</div>
        <div class="stat-value">--</div>
      </div>
    </section>

    <!-- Charts Section -->
    <section class="stats-section">
      <h2 class="section-title">Trend Analysis</h2>

      <div class="chart-container">
        <h3>AQI Trend</h3>
        <canvas id="aqiChart"></canvas>
      </div>

      <div class="chart-container">
        <h3>Temperature Trend</h3>
        <canvas id="tempChart"></canvas>
      </div>

      <div class="chart-container">
        <h3>Humidity Trend</h3>
        <canvas id="humChart"></canvas>
      </div>
    </section>
  </main>

<script>
  // ================= FIREBASE CONFIG =================
  const firebaseConfig = {
    apiKey: "AIzaSyB8_9RTIIYTmk89M5OebiTmNW7JpJUD0ks",
  authDomain: "airqualitymapping-feca1.firebaseapp.com",
  databaseURL: "https://airqualitymapping-feca1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "airqualitymapping-feca1",
  storageBucket: "airqualitymapping-feca1.firebasestorage.app",
  messagingSenderId: "468955011792",
  appId: "1:468955011792:web:08988bf166654da5185cd5"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ================= MAP =================
  const map = L.map('map').setView([27.7, 85.3], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  let marker;

  map.on('click', async function(e) {
      const lat = e.latlng.lat;
      const lon = e.latlng.lng;
      document.getElementById('selectedLocation').innerText = lat.toFixed(6) + ", " + lon.toFixed(6);

      if(marker) map.removeLayer(marker);
      marker = L.marker([lat, lon]).addTo(map);

      try {
          const readings = await fetchHistory();
          if(!readings.length) {
              alert('No history data found in Firebase!');
              return;
          }

          const nearest = findNearest(lat, lon, readings);
          displayNearest(nearest);
          updateCharts(readings, nearest);

      } catch(err) {
          console.error(err);
          alert('Error fetching data from Firebase!');
      }
  });

  // ================= FETCH HISTORY =================
  async function fetchHistory() {
      const snapshot = await db.ref('air_quality/history').once('value');
      let data = [];
      snapshot.forEach(child => {
          const d = child.val();
          data.push({
              lat: parseFloat(d.lat),
              lon: parseFloat(d.lon),
              mq: parseFloat(d.mq),
              temp: parseFloat(d.temp),
              hum: parseFloat(d.hum),
              timestamp: d.timestamp
          });
      });
      return data;
  }

  // ================= DISTANCE =================
  function distanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
  }

  // ================= NEAREST SENSOR =================
  function findNearest(lat, lon, data) {
      let nearest = data[0];
      let minDist = distanceKm(lat, lon, nearest.lat, nearest.lon);
      data.forEach(d => {
          const dist = distanceKm(lat, lon, d.lat, d.lon);
          if(dist < minDist) {
              minDist = dist;
              nearest = d;
          }
      });
      return nearest;
  }

  function displayNearest(sensor) {
      document.getElementById('nearestSensor').innerText =
          sensor.lat.toFixed(6) + ", " + sensor.lon.toFixed(6) + " (AQI: " + sensor.mq + ")";
  }

  // ================= TIMESTAMP PARSING =================
  function parseTimestamp(ts) {
      const parts = ts.split(' ');
      const dateParts = parts[0].split('-');
      const timePart = parts[1] || '00:00:00';
      return new Date(`20${dateParts[2]}-${dateParts[1]}-${dateParts[0]}T${timePart}`);
  }

  // ================= CHARTS =================
  let aqiChart, tempChart, humChart;

  function updateCharts(allData, sensor) {
      const filtered = allData
          .filter(d => distanceKm(sensor.lat, sensor.lon, d.lat, d.lon) < 1.0)
          .sort((a,b) => parseTimestamp(a.timestamp) - parseTimestamp(b.timestamp));

      if(!filtered.length) {
          alert('No readings found near this sensor!');
          return;
      }

      // Aggregate daily
      const dailyData = {};
      filtered.forEach(d => {
          const date = d.timestamp.split(' ')[0]; // dd-mm-yy
          if(!dailyData[date]) dailyData[date] = { sumMQ:0, sumTemp:0, sumHum:0, count:0 };
          dailyData[date].sumMQ += d.mq;
          dailyData[date].sumTemp += d.temp;
          dailyData[date].sumHum += d.hum;
          dailyData[date].count++;
      });

      const dates = Object.keys(dailyData).sort((a,b)=>{
          const [d1,m1,y1] = a.split('-').map(Number);
          const [d2,m2,y2] = b.split('-').map(Number);
          return new Date(y1+2000,m1-1,d1) - new Date(y2+2000,m2-1,d2);
      });

      const avgAQI = dates.map(d=> dailyData[d].sumMQ/dailyData[d].count);
      const avgTemp = dates.map(d=> dailyData[d].sumTemp/dailyData[d].count);
      const avgHum = dates.map(d=> dailyData[d].sumHum/dailyData[d].count);

      const nextDayAQI = predictNextDay(avgAQI);

      // Display predicted AQI
      const predictedValue = document.querySelector('#predictedAQI .stat-value');
      if (predictedValue) {
        predictedValue.textContent = nextDayAQI[0];
      }

      if(aqiChart) aqiChart.destroy();
      if(tempChart) tempChart.destroy();
      if(humChart) humChart.destroy();

      aqiChart = new Chart(document.getElementById('aqiChart'), {
          type: 'line',
          data: { labels: [...dates,"Next Day"], datasets: [{ label: 'AQI', data: [...avgAQI,...nextDayAQI], borderColor: '#0ea5e9', backgroundColor: 'rgba(14, 165, 233, 0.1)', fill: true, tension: 0.4 }] },
          options: {
              responsive: true,
              plugins: {
                  legend: { display: false }
              },
              scales: {
                  y: {
                      beginAtZero: true,
                      grid: { color: 'rgba(0,0,0,0.05)' }
                  },
                  x: {
                      grid: { color: 'rgba(0,0,0,0.05)' }
                  }
              }
          }
      });

      tempChart = new Chart(document.getElementById('tempChart'), {
          type: 'line',
          data: { labels: dates, datasets: [{ label: 'Temp (°C)', data: avgTemp, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', fill: true, tension: 0.4 }] },
          options: {
              responsive: true,
              plugins: {
                  legend: { display: false }
              },
              scales: {
                  y: {
                      beginAtZero: true,
                      grid: { color: 'rgba(0,0,0,0.05)' }
                  },
                  x: {
                      grid: { color: 'rgba(0,0,0,0.05)' }
                  }
              }
          }
      });

      humChart = new Chart(document.getElementById('humChart'), {
          type: 'line',
          data: { labels: dates, datasets: [{ label: 'Humidity (%)', data: avgHum, borderColor: '#06b6d4', backgroundColor: 'rgba(6, 182, 212, 0.1)', fill: true, tension: 0.4 }] },
          options: {
              responsive: true,
              plugins: {
                  legend: { display: false }
              },
              scales: {
                  y: {
                      beginAtZero: true,
                      grid: { color: 'rgba(0,0,0,0.05)' }
                  },
                  x: {
                      grid: { color: 'rgba(0,0,0,0.05)' }
                  }
              }
          }
      });
  }

  // ================= PREDICTION =================
  function predictNextDay(values) {
      const n = values.length;
      if(n<2) return [values[n-1]];

      let sumX=0,sumY=0,sumXY=0,sumXX=0;
      for(let i=0;i<n;i++){
          sumX += i;
          sumY += values[i];
          sumXY += i*values[i];
          sumXX += i*i;
      }
      const a = (n*sumXY - sumX*sumY)/(n*sumXX - sumX*sumX);
      const b = (sumY - a*sumX)/n;
      const next = a*n + b;
      return [parseFloat(next.toFixed(2))];
  }

  // ================= SCROLL TO SECTION =================
  function scrollToSection(sectionId) {
      const element = document.getElementById(sectionId);
      if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
      }
  }
</script>

</body>
</html>
